name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Install NDK and CMake
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
        yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true
        $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;4.1.2" || true
        ls $SDK_ROOT/ndk/
        ls $SDK_ROOT/cmake/ 2>/dev/null || echo "cmake not in sdk, will use AGP auto-download"

    - name: Build
      run: |
        chmod +x ./gradlew
        ./gradlew :module:assembleRelease --no-daemon

    - name: List output
      run: find out -type f

    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/
